// Distribution

apply plugin: 'com.jfrog.bintray'

defaultTasks 'dist'

configurations {
    create('server')
    create('serverCore')
    create('distributionZip')

    server { transitive = false }
    serverCore { transitive = false }
}

// Only include relevant projects
def serverCoreProjects = [
    project(':granite-common'),
    project(':granite-server-core'),
    project(':granite-server-servlet3')
]

serverCoreProjects.each { evaluationDependsOn(it.path) }

dependencies {
    serverCore serverCoreProjects
}

task dist(type: Zip) {
    serverCoreProjects.each { dependsOn it.path + ':jar' }

    archiveName = 'graniteds-dist-' + granitedsVersion + '.zip'

    into('graniteds-' + granitedsVersion) {
        from file('README.adoc')
        from file('LICENSES.adoc')

        into('licenses') {
            from fileTree('licenses') {
                exclude 'LICENSES.adoc'
            }
        }

        into('libraries/server/submodules') {
            from configurations.serverCore
        }

        serverCoreProjects.each { subproject ->
            subproject.configurations.archives.allArtifacts.findAll { it.classifier == 'sources' }.each { artifact ->
                into('sources/java') {
                    from artifact.file
                }
            }
        }
    }
}

artifacts {
    add("distributionZip", file(dist.archivePath)) {
        name = "graniteds-dist"
        type = "zip"
        builtBy dist
    }
}

def bintrayVersion = granitedsVersion

bintray {
    user = bintrayUserName
    key = bintrayApiKey
    configurations = ['archives']
    pkg {
        repo = 'graniteds'
        userOrg = 'graniteds'
        name = 'graniteds-distribution'
        desc = 'GraniteDS main distribution (core only)'
        licenses = ['LGPL-2.1', 'GPL-3.0']
        labels = ['graniteds', 'core', 'server']
        version {
            name = bintrayVersion
        }
    }
}